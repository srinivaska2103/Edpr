<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='currentColor'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E">
    <title>Page Not Found | EPDR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#0ea5e9' } } } }
    </script>
      <script>
    // 1. Check local storage or system preference
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300 min-h-screen flex flex-col">

    <nav class="flex justify-between items-center p-6">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="bg-primary p-1.5 rounded-lg group-hover:rotate-12 transition-transform duration-300">
                <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">EPDR</span>
        </a>
          <div class="flex gap-3">
              <!-- Theme Toggle (Fixed width/height) -->
    <button id="themeToggle" title="Toggle Theme"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all duration-300 active:scale-90 shadow-sm border border-slate-200 dark:border-slate-700">
        <svg id="themeIcon" class="w-5 h-5 text-slate-600 dark:text-slate-300 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
    </button>

    <!-- RTL Toggle (Matches width/height, flex centered) -->
    <button id="rtlToggle" 
            title="Toggle Text Direction"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all duration-300 active:scale-90 shadow-sm border border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300 uppercase">
        LTR
    </button>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="text-center space-y-6">
            <h1 class="text-[120px] md:text-[180px] font-bold text-primary leading-none">404</h1>
            <h2 class="text-3xl md:text-4xl font-semibold text-slate-900 dark:text-white">Page Not Found</h2>
            <p class="text-slate-600 dark:text-slate-400 max-w-md mx-auto font-normal">
                Oops! It looks like you've taken a wrong turn. Let's get you back to safety.
            </p>
            <div class="pt-6">
                <a href="index.html" class="inline-block px-8 py-4 bg-primary text-white rounded-full font-semibold hover:bg-sky-600 hover:shadow-lg hover:shadow-primary/30 active:scale-95 transition-all">
                    Return Home
                </a>
            </div>
        </div>
    </main>

    <script>
        const init = () => {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            if (localStorage.dir === 'rtl') document.body.dir = 'rtl';
        };
        
        document.getElementById('themeToggle').onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        };

        document.getElementById('rtlToggle').onclick = () => {
            const dir = document.body.dir === 'rtl' ? 'ltr' : 'rtl';
            document.body.dir = dir;
            localStorage.dir = dir;
        };
        init();
    </script>
</body>
</html>
