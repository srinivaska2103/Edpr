<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='currentColor'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E">
    <title>Sign Up | Elite PDR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#0ea5e9' } } } }
    </script>
      <script>
    // 1. Check local storage or system preference
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">

    <nav class="flex justify-between items-center p-6">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="bg-primary p-1.5 rounded-lg group-hover:rotate-12 transition-transform duration-300">
                <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">EPDR</span>
        </a>
         <div class="flex gap-3">
              <!-- Theme Toggle (Fixed width/height) -->
    <button id="themeToggle" title="Toggle Theme"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all duration-300 active:scale-90 shadow-sm border border-slate-200 dark:border-slate-700">
        <svg id="themeIcon" class="w-5 h-5 text-slate-600 dark:text-slate-300 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
    </button>

    <!-- RTL Toggle (Matches width/height, flex centered) -->
    <button id="rtlToggle" 
            title="Toggle Text Direction"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all duration-300 active:scale-90 shadow-sm border border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300 uppercase">
        LTR
    </button>
        </div>
    </nav>

    <div class="max-w-md mx-auto mt-6 mb-10 p-8 bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 transition-all hover:shadow-2xl">
    <div class="mb-8 text-center">
    <h2 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Create Account</h2>
    <p class="text-slate-500 dark:text-slate-400">Please enter your details to Create your account.</p>
</div>        
        <form class="space-y-4">
            <input type="text" placeholder="Full Name" class="w-full p-4 rounded-xl border dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-primary outline-none transition-all">
            <input type="email" placeholder="Email Address" class="w-full p-4 rounded-xl border dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-primary outline-none transition-all">
            
            <div class="relative">
                <input type="password" id="pass" placeholder="Password" class="w-full p-4 rounded-xl border dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-primary outline-none transition-all">
            </div>

            <div class="relative">
                <input type="password" id="confirmPass" placeholder="Confirm Password" class="w-full p-4 rounded-xl border dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-primary outline-none transition-all">
                <button type="button" onclick="togglePass()" class="absolute right-4 top-4 text-slate-400 hover:text-primary transition-colors">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="flex items-center text-sm">
                <label class="flex items-center gap-2 dark:text-slate-400 cursor-pointer">
                    <input type="checkbox" class="accent-primary w-4 h-4"> I agree to the <a href="#" class="text-primary font-semibold hover:underline">Terms & Privacy</a>
                </label>
            </div>

            <button class="w-full py-4 bg-primary text-white rounded-xl font-semibold hover:bg-sky-600 hover:shadow-lg hover:shadow-primary/30 active:scale-[0.98] transition-all">Sign Up</button>
        </form>

        <div class="mt-6 text-center text-sm dark:text-slate-400">
            Already have an account? <a href="login.html" class="text-primary font-semibold hover:underline">Log In</a>
        </div>

        <div class="mt-8 flex justify-center gap-4">
            <button class="p-3 rounded-full border dark:border-slate-700 w-12 h-12 flex items-center justify-center hover:border-primary transition-all group">
                <svg class="w-6 h-6 text-slate-900 dark:text-white group-hover:text-primary" viewBox="0 0 48 48" fill="currentColor"><path d="M44.5 20H24v8.5h11.8C34.7 32.2 30.2 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.4 1 7.4 2.8l6.3-6.3C33.5 5.5 29.1 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c12 0 21-8.5 21-21 0-1.4-.1-2.8-.5-4z"/></svg>
            </button>
            <button class="p-3 rounded-full border dark:border-slate-700 w-12 h-12 flex items-center justify-center hover:border-primary transition-all group">
                <svg class="w-6 h-6 text-slate-900 dark:text-white group-hover:text-primary" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </button>
            <button class="p-3 rounded-full border dark:border-slate-700 w-12 h-12 flex items-center justify-center hover:border-primary transition-all group">
                <svg class="w-6 h-6 text-slate-900 dark:text-white group-hover:text-primary" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.75c-.07-2.21 1.79-3.28 1.88-3.33-1.02-1.49-2.58-1.69-3.14-1.71-1.34-.14-2.62.79-3.3.79-.68 0-1.75-.82-2.88-.79-1.48.02-2.85.86-3.62 2.19-1.57 2.71-.4 6.67 1.13 8.87.75 1.07 1.64 2.27 2.8 2.22 1.12-.05 1.56-.72 2.94-.72 1.38 0 1.77.72 2.97.69 1.25-.03 2.02-1.09 2.78-2.16 1.48-2.12 2.08-4.17 2.1-4.28-.05-.02-1.99-.76-2.03-3.05zM15.42 6.1c.62-.75 1.03-1.79.91-2.83-1.19.05-2.62.79-3.46 1.77-.56.63-1.06 1.68-.93 2.71 1.25.1 2.45-.63 3.48-1.65z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const init = () => {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            if (localStorage.dir === 'rtl') document.body.dir = 'rtl';
        };
        
        document.getElementById('themeToggle').onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        };

        document.getElementById('rtlToggle').onclick = () => {
            const dir = document.body.dir === 'rtl' ? 'ltr' : 'rtl';
            document.body.dir = dir;
            localStorage.dir = dir;
        };

        function togglePass() {
            const p = document.getElementById('pass');
            const cp = document.getElementById('confirmPass');
            p.type = p.type === 'password' ? 'text' : 'password';
            cp.type = cp.type === 'password' ? 'text' : 'password';
        }
        init();
    </script>
</body>
</html>
